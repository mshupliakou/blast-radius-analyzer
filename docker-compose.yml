services:
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/neo4j
      NEO4J_dbms_default__database: microservices
    ports:
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "neo4j", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      NEO4J_URI: neo4j://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: neo4j
      NEO4J_DATABASE: microservices
      JWT_SECRET: 843567893696976453275974432697R634976R738467TR678T34865R6834R8763T4783786
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4j_data:
